# Pricing: https://jzstoken.com/model-pricing/gpt-6-astra (2026-10-30).
# Effort: reasoning_effort = low|medium|high|xhigh|max
# freeform custom tools are explicitly omitted; the host publishes no certification
# and no customer API key was available for the requested restrictive-grammar probe.
schema = 2
base_model = "openai/gpt-6-astra"
base_model_omit = ["capabilities.tools.freeform"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.17
cache = { read = 0.1168, write = 1.75 }

[cost.text.output]
price = 7.01
