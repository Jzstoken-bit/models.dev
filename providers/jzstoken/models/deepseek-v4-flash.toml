# Pricing: https://jzstoken.com/model-pricing/deepseek-v4-flash (2026-10-30).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# The displayed base prices are off-peak; JZSTOKEN documents a 2x peak every day
# at 09:00-12:00 and 14:00-18:00 Asia/Shanghai (01:00-04:00 and 06:00-10:00 UTC).
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.1497
cache = { read = 0.015, write = 0.1497 }

[cost.text.output]
price = 0.7485

[[cost.multipliers]]
when = { any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
